[package]
name = "jm-core"
description = "Japanese Mastery core: persistence, migrations, backups, import/export. No UI or Tauri dependencies."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "v5", "serde"] }
thiserror = "1"
sha2 = "0.10"
hex = "0.4"
csv = "1.3"

[dev-dependencies]
tempfile = "3"
