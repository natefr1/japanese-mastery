[package]
name = "japanese-mastery"
description = "Japanese Mastery — desktop Japanese learning RPG"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "japanese_mastery_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jm-core = { path = "../crates/jm-core" }

# API keys live in the OS credential store (Windows Credential Manager).
[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

# Non-Windows builds (CI checks only) use keyring's in-memory mock store.
[target.'cfg(not(windows))'.dependencies]
keyring = "3"
